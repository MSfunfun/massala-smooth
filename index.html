<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d5efd2">
  <title>massala</title>
  <link rel="icon" type="image/png" href="massala-app-icon.png">
  <link rel="apple-touch-icon" href="massala-app-icon.png">
  <link rel="manifest" href="manifest-smooth.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="massala">
  <style>
    :root { --paper: #f1eadb; --ink: #1f1a16; --vermilion: #b93b2f; --sky: #d5efd2; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; overflow: hidden; background: var(--sky); color: var(--ink); font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; -webkit-tap-highlight-color: transparent; transition: background-color 1.2s linear; }
    .clock { width: min(91vw, 88vh, 680px); aspect-ratio: 1; position: relative; display: grid; place-items: center; }
    .marker { position: absolute; z-index: 7; top: -1.2%; left: 50%; width: 0; height: 0; transform: translateX(-50%); border-left: clamp(8px, 1.8vw, 12px) solid transparent; border-right: clamp(8px, 1.8vw, 12px) solid transparent; border-top: clamp(15px, 3vw, 22px) solid var(--vermilion); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); }
    .marker::after { content: ""; position: absolute; left: 50%; top: clamp(-18px, -3.4vw, -24px); width: 1px; height: clamp(20px, 4vw, 30px); transform: translateX(-50%); background: var(--vermilion); }
    .second-ring { position: absolute; z-index: 4; inset: -5.2%; width: 110.4%; height: 110.4%; overflow: visible; pointer-events: none; transform: rotate(-90deg) scaleX(-1); }
    .second-progress { fill: none; stroke: #a7b976; stroke-width: .95; stroke-linecap: round; filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .42)); }
    .dial { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.48), transparent 38%), repeating-radial-gradient(circle at center, transparent 0 10px, rgba(69,50,30,.018) 11px 12px), var(--paper); box-shadow: 0 20px 45px rgba(54,36,42,.20), inset 0 0 0 clamp(2px,.5vw,4px) rgba(55,40,24,.2), inset 0 0 35px rgba(94,68,36,.1); will-change: transform; }
    .dial::before, .dial::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
    .dial::before { inset: 7%; border: 1px solid rgba(55,40,24,.20); }
    .dial::after { inset: 20%; border: 1px solid rgba(55,40,24,.13); }
    .tick { position: absolute; top: 50%; left: 50%; width: 1px; height: 1px; transform: rotate(var(--angle)); pointer-events: none; color: var(--time-color); }
    .tick::after { content: ""; position: absolute; left: 0; top: calc(-1 * min(45.5vw,45.5vh,311px)); width: 1px; height: clamp(8px,2.5vw,16px); background: currentColor; opacity: .72; transform: translateX(-50%); }
    .tick.major::after { width: 2px; height: clamp(12px,3.4vw,22px); opacity: .9; }
    .label { position: absolute; top: 50%; left: 50%; width: 1px; height: 1px; transform: rotate(var(--angle)); pointer-events: none; user-select: none; }
    .label span { position: absolute; left: 0; transform: translate(-50%,-50%); color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.55); line-height: 1; white-space: nowrap; }
    .hour span { top: calc(-1 * min(40.5vw,40.5vh,277px)); color: var(--time-color); font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: clamp(12px,3.4vw,23px); font-weight: 600; text-shadow: 0 1px 0 rgba(255,255,255,.45); }
    .zodiac span { top: calc(-1 * min(31vw,31vh,212px)); font-size: clamp(23px,6.5vw,44px); letter-spacing: .04em; }
    .center { z-index: 2; width: 28%; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid rgba(55,40,24,.24); border-radius: 50%; background: rgba(241,234,219,.92); box-shadow: inset 0 0 16px rgba(89,62,30,.09); font-size: clamp(52px,14vw,92px); line-height: 1; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.55); user-select: none; }
    @media (max-height: 500px) and (orientation: landscape) { .clock { width: min(70vw,84vh,570px); } .tick::after { top: calc(-1 * min(34vw,44vh,295px)); } .hour span { top: calc(-1 * min(30vw,40vw,260px)); } .zodiac span { top: calc(-1 * min(23vw,30vh,195px)); } }
    @media (prefers-reduced-motion: reduce) { .dial { will-change: auto; } body { transition: none; } }
  </style>
</head>
<body>
  <main class="clock" aria-label="和時計 massala">
    <div class="marker" aria-hidden="true"></div>
    <svg class="second-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="second-progress" id="secondProgress" cx="50" cy="50" r="48" pathLength="100"></circle></svg>
    <div class="dial" id="dial" aria-hidden="true"></div>
    <div class="center" id="currentKoku" aria-live="polite">子</div>
  </main>
  <script>
    const dial = document.getElementById('dial');
    const currentKoku = document.getElementById('currentKoku');
    const secondProgress = document.getElementById('secondProgress');
    const koku = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const day = 86400000;
    function hexToHsl(hex) { const v=hex.replace('#',''); const r=parseInt(v.slice(0,2),16)/255,g=parseInt(v.slice(2,4),16)/255,b=parseInt(v.slice(4,6),16)/255; const max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2,d=max-min; let h=0,s=0; if(d){s=d/(1-Math.abs(2*l-1)); if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;} return {hue:h,saturation:s*100,lightness:l*100}; }
    function interpolateHsl(a,b,p) { const d=((b.hue-a.hue+540)%360)-180; return {hue:(a.hue+d*p+360)%360,saturation:a.saturation+(b.saturation-a.saturation)*p,lightness:a.lightness+(b.lightness-a.lightness)*p}; }
    const dayStops=[{hour:6,color:hexToHsl('#A7B976')},{hour:12,color:hexToHsl('#B5685D')},{hour:15,color:hexToHsl('#C6A75A')},{hour:18,color:{hue:214,saturation:37,lightness:56}}];
    function timeHsl(hour) { if(hour>=6&&hour<=18){for(let i=0;i<dayStops.length-1;i+=1){const a=dayStops[i],b=dayStops[i+1];if(hour>=a.hour&&hour<=b.hour)return interpolateHsl(a.color,b.color,(hour-a.hour)/(b.hour-a.hour));}return dayStops.at(-1).color;} const p=((hour-18+24)%24)/12; return {hue:174+p*92,saturation:48,lightness:27}; }
    function timeColor(hour) { const c=timeHsl(hour); return `hsl(${c.hue} ${c.saturation}% ${c.lightness}%)`; }
    function currentTimeColor(hour,minute,second,millisecond) { const exact=hour+minute/60+second/3600+millisecond/3600000,base=Math.floor(exact)%24,next=(base+1)%24,c=interpolateHsl(timeHsl(base),timeHsl(next),exact-Math.floor(exact)); return `hsl(${c.hue} ${c.saturation}% ${c.lightness}%)`; }
    function backgroundColor(hour,minute,second,millisecond) { const exact=hour+minute/60+second/3600+millisecond/3600000,baseHour=Math.floor(exact)%24,nextHour=(baseHour+1)%24,base=interpolateHsl(timeHsl(baseHour),timeHsl(nextHour),exact-Math.floor(exact)); if(exact>=6&&exact<=18){const p=(exact-6)/12,standard={hue:base.hue,saturation:Math.max(25,base.saturation*.70),lightness:Math.min(90,base.lightness+29)},result=interpolateHsl(hexToHsl('#D5EFD2'),standard,Math.min(1,p*3)); return `hsl(${result.hue} ${result.saturation}% ${result.lightness}%)`; } return `hsl(${base.hue} ${Math.max(25,base.saturation*.76)}% ${Math.min(62,base.lightness+25)}%)`; }
    function addTick(hour) { const e=document.createElement('div');e.className=hour%2===0?'tick major':'tick';e.style.setProperty('--angle',`${hour*15}deg`);e.style.setProperty('--time-color',timeColor(hour));dial.appendChild(e); }
    function addHour(hour) { const e=document.createElement('div'),s=document.createElement('span');e.className='label hour';e.style.setProperty('--angle',`${hour*15}deg`);e.style.setProperty('--time-color',timeColor(hour));s.textContent=hour;e.appendChild(s);dial.appendChild(e); }
    function addZodiac(index) { const e=document.createElement('div'),s=document.createElement('span');e.className='label zodiac';e.style.setProperty('--angle',`${index*30}deg`);s.textContent=koku[index];e.appendChild(s);dial.appendChild(e); }
    for(let h=0;h<24;h+=1){addTick(h);addHour(h);} for(let i=0;i<koku.length;i+=1)addZodiac(i);
    function updateClock() { const now=new Date(),elapsed=now.getHours()*3600000+now.getMinutes()*60000+now.getSeconds()*1000+now.getMilliseconds(); dial.style.transform=`rotate(${-(elapsed/day)*360}deg)`; document.documentElement.style.setProperty('--sky',backgroundColor(now.getHours(),now.getMinutes(),now.getSeconds(),now.getMilliseconds())); const seconds=now.getSeconds()+now.getMilliseconds()/1000; secondProgress.style.strokeDasharray=`${(seconds/60)*100} 100`; secondProgress.style.stroke=currentTimeColor(now.getHours(),now.getMinutes(),now.getSeconds(),now.getMilliseconds()); currentKoku.textContent=koku[Math.floor(((elapsed+3600000)%day)/7200000)]; requestAnimationFrame(updateClock); }
    requestAnimationFrame(updateClock);
  </script>
</body>
</html>
